<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>User Directory Dashboard</h1>
        <div>
            <input class="search-input" type="text" id="searchInput" placeholder="Search users by name..."
                onkeyup="filterUsers()">
        </div>

        <p id="loading">Loading Users..........</p>
        <div class="user-container" id="userContainer">
            <!-- User cards will be populated here -->
        </div>
        <p id="noUsers">
            <img src="assets/no-users.jpg" alt="No Users Found" class="no-users-image">
            <span class="noUserText">No Users Found</span>
        </p>

        <p id="error"></p>

    </div>
    <script src="script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            getUserData();
        });
    </script>

</body>

</html>
